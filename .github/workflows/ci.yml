# Every push and pull request: the checks a contributor runs locally, plus the database tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, data, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Story data (npm run check)
        run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npx prettier --check .
      - name: Generated files are up to date
        run: |
          npm run db:seed
          npm run db:sql-editor
          git diff --exit-code -- supabase/seed.sql supabase/bootstrap.sql supabase/setup/schema.sql
      # without SITE_URL and the Supabase keys the prerender step only writes robots.txt
      - run: npm run build

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Postgres only: applies supabase/migrations and supabase/seed.sql
      - run: supabase db start
      - run: supabase test db
